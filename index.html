<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Espacio de Jessica</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    margin:0;
    overflow-x:hidden;
    background:linear-gradient(135deg,#f8fafc,#eef2ff,#ecfdf5);
    font-family:sans-serif;
    min-height:100vh;
}

.fondo{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.flotante{
    position:absolute;
    font-size:28px;
    opacity:.5;
    animation:flotar linear infinite;
}

@keyframes flotar{
    from{
        transform:translateY(100vh) rotate(0deg);
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

.card{
    animation:entrada .7s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

textarea{
    resize:none;
}

.oculto{
    display:none;
}
</style>
</head>

<body>

<div class="fondo" id="fondo"></div>

<div class="max-w-3xl mx-auto p-4">

<div class="bg-white rounded-3xl shadow-xl p-6 mt-6 card">

<div class="text-center">

<div class="text-6xl mb-3">🌷</div>

<h1 class="text-4xl font-bold text-gray-700">
El Espacio de Jessica
</h1>

<p class="text-gray-500 mt-2">
Tu espacio emocional privado y seguro.
</p>

</div>

<div class="mt-6">

<select id="emocion"
class="w-full p-4 rounded-2xl border text-lg">

<option>😊 Feliz</option>
<option>🥰 Amada</option>
<option>😌 En paz</option>
<option>😢 Triste</option>
<option>😭 Muy triste</option>
<option>😔 Vacía</option>
<option>😰 Ansiosa</option>
<option>😡 Enojada</option>
<option>😩 Frustrada</option>
<option>🥺 Sensible</option>
<option>😴 Cansada</option>
<option>😵 Abrumada</option>
<option>😞 Agotada</option>
<option>🌊 Perdida</option>
<option>🤍 Neutral</option>
<option>🙏 Agradecida</option>
<option>😬 Insegura</option>
<option>💔 Vulnerable</option>
<option>🤩 Emocionada</option>
<option>😶 Desconectada</option>
<option>🫤 Confundida</option>
<option>❤️ Lastimada</option>
<option>🌸 Esperanzada</option>
<option>🧠 Reflexiva</option>
<option>😇 Motivada</option>
<option>🌙 Nostálgica</option>
<option>😟 Preocupada</option>
<option>😮 Saturada</option>
<option>😎 Segura</option>
<option>🍂 Melancólica</option>

</select>

<textarea
id="texto"
class="w-full mt-4 p-4 rounded-2xl border h-40"
placeholder="Escribe cómo te sientes..."
></textarea>

<button
onclick="guardarEntrada()"
class="w-full mt-4 bg-pink-400 hover:bg-pink-500 transition text-white p-4 rounded-2xl text-lg font-bold">
Guardar entrada 🌸
</button>

<div class="grid grid-cols-2 gap-3 mt-4">

<button
onclick="exportarTXT()"
class="bg-indigo-400 text-white p-3 rounded-2xl">
Exportar TXT
</button>

<button
onclick="exportarJSON()"
class="bg-emerald-400 text-white p-3 rounded-2xl">
Exportar JSON
</button>

</div>

</div>
</div>

<div id="lista" class="mt-6 space-y-4"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSoz_PY7s67kMI8mULucVBX2bcVwwMTRg",
  authDomain: "el-espacio-de-jessica.firebaseapp.com",
  projectId: "el-espacio-de-jessica",
  storageBucket: "el-espacio-de-jessica.firebasestorage.app",
  messagingSenderId: "1061987617949",
  appId: "1:1061987617949:web:28b05e0016d31308f21874",
  measurementId: "G-MK8B3BNWSS"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const lista = document.getElementById("lista");

window.guardarEntrada = async function(){

const emocion = document.getElementById("emocion").value;

const texto = document.getElementById("texto").value;

if(texto.trim()===""){
alert("Escribe algo 🌸");
return;
}

await addDoc(collection(db,"entradas"),{
emocion,
texto,
fecha:new Date().toLocaleString()
});

document.getElementById("texto").value="";

};

onSnapshot(collection(db,"entradas"),(snapshot)=>{

lista.innerHTML="";

snapshot.forEach((docu)=>{

const data = docu.data();

lista.innerHTML += `
<div class="bg-white rounded-3xl p-5 shadow-lg card">

<div class="flex justify-between items-center">

<div>
<h2 class="text-2xl font-bold text-pink-500">
${data.emocion}
</h2>

<p class="text-sm text-gray-400">
${data.fecha}
</p>
</div>

<div class="flex gap-2">

<button
onclick="editarEntrada('${docu.id}','${data.texto}')"
class="bg-yellow-300 px-4 py-2 rounded-xl">
✏️
</button>

<button
onclick="eliminarEntrada('${docu.id}')"
class="bg-red-400 text-white px-4 py-2 rounded-xl">
🗑️
</button>

</div>

</div>

<p class="mt-4 text-gray-700 whitespace-pre-wrap">
${data.texto}
</p>

</div>
`;

});

});

window.eliminarEntrada = async function(id){

if(confirm("¿Eliminar entrada?")){

await deleteDoc(doc(db,"entradas",id));

}

};

window.editarEntrada = async function(id,texto){

const nuevo = prompt("Editar entrada:",texto);

if(nuevo!==null){

await updateDoc(doc(db,"entradas",id),{
texto:nuevo
});

}

};

window.exportarTXT = function(){

let contenido = "";

document.querySelectorAll("#lista .bg-white").forEach(e=>{

contenido += e.innerText + "\n\n";

});

const blob = new Blob([contenido],{type:"text/plain"});

const a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "diario.txt";

a.click();

};

window.exportarJSON = function(){

const contenido = [];

document.querySelectorAll("#lista .bg-white").forEach(e=>{

contenido.push(e.innerText);

});

const blob = new Blob(
[JSON.stringify(contenido,null,2)],
{type:"application/json"}
);

const a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "diario.json";

a.click();

};

const emojis = [
"🌸","✨","🦋","💖","🌷","🤍","⭐","🍓"
];

for(let i=0;i<40;i++){

const span = document.createElement("span");

span.className="flotante";

span.innerHTML =
emojis[Math.floor(Math.random()*emojis.length)];

span.style.left=Math.random()*100+"vw";

span.style.animationDuration=
(10+Math.random()*20)+"s";

span.style.fontSize=
(20+Math.random()*25)+"px";

document.getElementById("fondo").appendChild(span);

}

</script>

</body>
</html>
