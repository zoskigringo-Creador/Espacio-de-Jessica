<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Espacio de Jessica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
font-family:'Nunito',sans-serif;
}

html{
overscroll-behavior-y:none;
}

body{
margin:0;
overflow-x:hidden;
background:linear-gradient(135deg,#f8fafc,#eef2ff,#ccfbf1);
min-height:100vh;
color:#334155;
transition:.5s;
}

.dark-mode{
background:#0f172a;
color:white;
}

.glass{
backdrop-filter:blur(14px);
background:rgba(255,255,255,.7);
border:1px solid rgba(255,255,255,.5);
box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.floaty{
position:fixed;
font-size:28px;
pointer-events:none;
animation:floatUp linear forwards;
opacity:.15;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0;
}
10%{
opacity:.2;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

.fade-in{
animation:fade .6s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}
}

.mood-selected{
background:#4f46e5 !important;
color:white !important;
transform:scale(1.03);
}

.theme-pink{
background:linear-gradient(135deg,#ffe4e6,#fdf2f8,#faf5ff);
}

.theme-blue{
background:linear-gradient(135deg,#dbeafe,#eef2ff,#ecfeff);
}

.theme-green{
background:linear-gradient(135deg,#dcfce7,#ecfeff,#f0fdf4);
}

textarea{
resize:none;
}
</style>
</head>
<body>

<div id="floatingContainer"></div>

<section id="loginView" class="min-h-screen flex items-center justify-center p-6">
<div class="glass rounded-3xl p-10 w-full max-w-md text-center fade-in">
<div class="text-6xl mb-5">🌷</div>
<h1 class="text-4xl font-extrabold">El Espacio de Jessica</h1>
<p class="mt-4 text-slate-600">Tu espacio emocional privado y seguro.</p>
<button id="googleLoginBtn" class="mt-8 w-full bg-white rounded-2xl py-4 font-bold shadow-lg hover:scale-105 transition">
✨ Iniciar sesión con Google
</button>
</div>
</section>

<section id="appView" class="hidden p-5 md:p-8">

<div class="glass rounded-3xl p-5 mb-6 fade-in">
<div class="flex flex-col lg:flex-row gap-4 justify-between">
<div>
<h1 class="text-3xl font-extrabold">🌿 El Espacio de Jessica</h1>
<p class="mt-2">Tu progreso emocional diario.</p>
</div>

<div class="flex flex-wrap gap-3">
<select id="themeSelector" class="rounded-2xl px-4 py-3 bg-white shadow-md font-bold">
<option value="default">🎨 Tema normal</option>
<option value="theme-pink">🌸 Rosa pastel</option>
<option value="theme-blue">💎 Azul pastel</option>
<option value="theme-green">🌿 Verde pastel</option>
</select>

<button id="exportWordBtn" class="bg-indigo-500 text-white px-5 py-3 rounded-2xl font-bold">📄 Word</button>
<button id="exportPdfBtn" class="bg-rose-500 text-white px-5 py-3 rounded-2xl font-bold">📕 PDF</button>
<button id="logoutBtn" class="bg-slate-200 px-5 py-3 rounded-2xl font-bold">🚪 Salir</button>
</div>
</div>

<div class="mt-5 bg-white/60 rounded-2xl p-4 font-bold">
🌸 Sesión iniciada como: <span id="userEmail"></span>
</div>
</div>

<div class="grid lg:grid-cols-2 gap-6">

<div class="glass rounded-3xl p-6 fade-in">
<h2 class="text-2xl font-extrabold mb-5">✍️ Nueva entrada</h2>

<div class="relative">
<button id="toggleMoodMenu" class="w-full bg-white rounded-2xl p-4 text-left font-bold shadow-md">
😊 Seleccionar emoción
</button>

<div id="moodDropdown" class="hidden absolute z-50 mt-3 w-full max-h-[320px] overflow-y-auto bg-white rounded-3xl shadow-2xl p-4">
<div class="grid grid-cols-2 gap-3" id="moodsContainer"></div>
</div>
</div>

<textarea id="entryText" rows="8" class="w-full mt-5 rounded-3xl p-5 border border-slate-200 bg-white/80" placeholder="Escribe aquí lo que sientes..."></textarea>

<button id="saveBtn" class="mt-5 w-full bg-gradient-to-r from-indigo-500 to-teal-400 text-white py-4 rounded-2xl font-extrabold shadow-lg">
💾 Guardar entrada
</button>
</div>

<div>

<div class="glass rounded-3xl p-5 mb-6 fade-in">
<h2 class="text-2xl font-extrabold mb-4">📈 Estadísticas emocionales</h2>
<div id="emotionStats" class="space-y-2"></div>

<div class="mt-5">
<h3 class="font-extrabold text-lg">☁️ Clima emocional</h3>
<div id="emotionWeather" class="mt-2"></div>
</div>

<div class="mt-5">
<h3 class="font-extrabold text-lg">🧸 Frase motivacional</h3>
<div id="motivationPhrase" class="italic mt-2"></div>
</div>

<div class="mt-5">
<h3 class="font-extrabold text-lg">🧠 Resumen emocional</h3>
<div id="aiSummary" class="mt-2"></div>
</div>
</div>

<div class="glass rounded-3xl p-6 fade-in">
<div class="flex flex-col md:flex-row justify-between gap-4 mb-5">
<h2 class="text-2xl font-extrabold">📚 Historial</h2>
<input type="date" id="dateFilter" class="bg-white rounded-2xl px-4 py-3 border">
</div>

<div id="entriesContainer" class="space-y-4 max-h-[700px] overflow-y-auto"></div>
</div>

</div>
</div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_AUTH_DOMAIN",
projectId: "TU_PROJECT_ID",
storageBucket: "TU_STORAGE_BUCKET",
messagingSenderId: "TU_MESSAGING_SENDER_ID",
appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const moods = [
"😄 Feliz","🥰 Amada","😌 En paz","😔 Triste","😢 Muy triste","😞 Vacía",
"😰 Ansiosa","😡 Enojada","😤 Frustrada","🥺 Sensible","😴 Cansada",
"🤯 Abrumada","🫠 Agotada","🌫️ Perdida","🤍 Neutral","🫶 Agradecida",
"😬 Insegura","😭 Vulnerable","🥳 Emocionada","😶 Desconectada",
"😵 Confundida","💔 Lastimada","🌸 Esperanzada","🧠 Reflexiva",
"😇 Motivada","🥹 Nostálgica","😟 Preocupada","🤒 Saturada",
"😎 Segura","🥲 Melancólica"
];

const phrases = [
"🌸 Todo progreso emocional también es progreso.",
"🫶 Está bien descansar.",
"☁️ Tus emociones son válidas.",
"🌷 Hoy también sobreviviste.",
"✨ Cada día cuenta.",
"🌿 Sanar toma tiempo."
];

const moodsContainer = document.getElementById('moodsContainer');
const toggleMoodMenu = document.getElementById('toggleMoodMenu');
const moodDropdown = document.getElementById('moodDropdown');
const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const googleLoginBtn = document.getElementById('googleLoginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const saveBtn = document.getElementById('saveBtn');
const exportWordBtn = document.getElementById('exportWordBtn');
const exportPdfBtn = document.getElementById('exportPdfBtn');
const entryText = document.getElementById('entryText');
const entriesContainer = document.getElementById('entriesContainer');
const userEmail = document.getElementById('userEmail');
const emotionStats = document.getElementById('emotionStats');
const emotionWeather = document.getElementById('emotionWeather');
const motivationPhrase = document.getElementById('motivationPhrase');
const aiSummary = document.getElementById('aiSummary');
const dateFilter = document.getElementById('dateFilter');
const themeSelector = document.getElementById('themeSelector');

let selectedMood = '';
let currentEntries = [];
let currentUser = null;
let editingId = null;

motivationPhrase.innerText = phrases[Math.floor(Math.random()*phrases.length)];

moods.forEach(mood=>{
const btn = document.createElement('button');
btn.className = 'bg-slate-100 rounded-2xl p-3 font-bold hover:scale-105 transition';
btn.innerText = mood;
btn.onclick = ()=>{
document.querySelectorAll('#moodsContainer button').forEach(b=>b.classList.remove('mood-selected'));
btn.classList.add('mood-selected');
selectedMood = mood;
toggleMoodMenu.innerText = mood;
moodDropdown.classList.add('hidden');
};
moodsContainer.appendChild(btn);
});

toggleMoodMenu.onclick = ()=>{
moodDropdown.classList.toggle('hidden');
};

const emojis = ['🐱','🐶','🦜','🐰','🐾','🌸','☁️'];

function createFloat(){
const el = document.createElement('div');
el.className = 'floaty';
el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
el.style.left = Math.random()*100+'vw';
el.style.bottom='-50px';
el.style.animationDuration = (10+Math.random()*10)+'s';
document.body.appendChild(el);
setTimeout(()=>el.remove(),20000);
}

setInterval(createFloat,1200);

window.addEventListener('beforeunload', function(e){
e.preventDefault();
e.returnValue='';
});

setInterval(()=>{
localStorage.setItem('autosaveText',entryText.value);
},1000);

entryText.value = localStorage.getItem('autosaveText') || '';

const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
if(prefersDark.matches){
document.body.classList.add('dark-mode');
}

themeSelector.addEventListener('change',()=>{
document.body.classList.remove('theme-pink','theme-blue','theme-green');
if(themeSelector.value !== 'default'){
document.body.classList.add(themeSelector.value);
}
});

googleLoginBtn.onclick = async()=>{
try{
await signInWithPopup(auth,provider);
}catch(err){
alert('Error al iniciar sesión');
}
};

logoutBtn.onclick = async()=>{
await signOut(auth);
};

onAuthStateChanged(auth,(user)=>{
if(user){
currentUser = user;
userEmail.innerText = user.email;
loginView.classList.add('hidden');
appView.classList.remove('hidden');
loadEntries();
}else{
loginView.classList.remove('hidden');
appView.classList.add('hidden');
}
});

saveBtn.onclick = async()=>{

if(!selectedMood){
alert('Selecciona una emoción');
return;
}

const now = new Date();

const data = {
mood:selectedMood,
text:entryText.value,
date:now.toLocaleDateString(),
time:now.toLocaleTimeString(),
createdAt:serverTimestamp()
};

if(editingId){
await updateDoc(doc(db,`users/${currentUser.uid}/entries/${editingId}`),data);
editingId = null;
}else{
await addDoc(collection(db,`users/${currentUser.uid}/entries`),data);
}

entryText.value='';
localStorage.removeItem('autosaveText');
};

function loadEntries(){

const q = query(
collection(db,`users/${currentUser.uid}/entries`),
orderBy('createdAt','desc')
);

onSnapshot(q,(snapshot)=>{
currentEntries=[];

snapshot.forEach(docu=>{
currentEntries.push({
id:docu.id,
...docu.data()
});
});

renderEntries();
});
}

function updateStats(){

emotionStats.innerHTML='';

const counts = {};

currentEntries.forEach(e=>{
counts[e.mood]=(counts[e.mood]||0)+1;
});

Object.entries(counts).slice(0,5).forEach(([mood,count])=>{
emotionStats.innerHTML += `
<div class="bg-white/60 rounded-2xl px-4 py-3">
${mood} — ${count} veces
</div>
`;
});

const sad = currentEntries.filter(e=>String(e.mood).includes('😔') || String(e.mood).includes('😢')).length;

emotionWeather.innerText = sad >= 5
? '🌧️ Clima emocional sensible'
: '🌤️ Clima emocional estable';

aiSummary.innerText = currentEntries.length > 0
? 'Se detecta actividad emocional constante y reflexiva en los registros recientes.'
: 'Todavía no hay suficientes datos emocionales.';
}

function renderEntries(){

entriesContainer.innerHTML='';

let filtered = currentEntries;

if(dateFilter.value){
filtered = currentEntries.filter(e=>e.date.includes(dateFilter.value.split('-').reverse().join('/')));
}

filtered.forEach(entry=>{

const div = document.createElement('div');

div.className='bg-white/80 rounded-3xl p-5 shadow-md fade-in';

div.innerHTML=`
<div class="flex justify-between gap-4 flex-wrap mb-4">
<div>
<div class="font-extrabold text-lg">${entry.mood}</div>
<div class="text-sm text-slate-500">📅 ${entry.date} ⏰ ${entry.time}</div>
</div>

<div class="flex gap-2">
<button class="editBtn bg-indigo-100 px-3 py-2 rounded-xl">✏️</button>
<button class="deleteBtn bg-red-100 px-3 py-2 rounded-xl">🗑️</button>
</div>
</div>

<p class="whitespace-pre-wrap">${entry.text || '<i>Sin texto</i>'}</p>
`;

const editBtn = div.querySelector('.editBtn');
const deleteBtn = div.querySelector('.deleteBtn');

editBtn.onclick = ()=>{
editingId = entry.id;
entryText.value = entry.text;
selectedMood = entry.mood;
window.scrollTo({top:0,behavior:'smooth'});
};

deleteBtn.onclick = async()=>{
if(confirm('¿Eliminar entrada?')){
await deleteDoc(doc(db,`users/${currentUser.uid}/entries/${entry.id}`));
}
};

entriesContainer.appendChild(div);
});

updateStats();
}

dateFilter.addEventListener('change',renderEntries);

exportWordBtn.onclick = ()=>{
let html = '<h1>El Espacio de Jessica</h1>';

currentEntries.forEach(e=>{
html += `<h2>${e.mood}</h2><p>${e.date} ${e.time}</p><p>${e.text}</p><hr>`;
});

const blob = new Blob([html],{type:'application/msword'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href=url;
a.download='diario.doc';
a.click();
};

exportPdfBtn.onclick = ()=>{
const { jsPDF } = window.jspdf;
const pdf = new jsPDF();

let y = 20;

pdf.text('El Espacio de Jessica',20,y);
y += 20;

currentEntries.forEach(e=>{
pdf.text(`${e.mood}`,20,y);
y += 8;
pdf.text(`${e.date} ${e.time}`,20,y);
y += 8;

const lines = pdf.splitTextToSize(e.text || 'Sin texto',170);
pdf.text(lines,20,y);
y += lines.length*6 + 10;

if(y>260){
pdf.addPage();
y=20;
}
});

pdf.save('diario.pdf');
};

</script>
</body>
</html>
