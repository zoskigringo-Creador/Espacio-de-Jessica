<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags para bloquear el modo oscuro -->
    <meta name="color-scheme" content="light only">
    <meta name="darkreader-lock">
    <title>El Espacio de Jessica 🌸</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        /* ARMADURA CONTRA EL MODO OSCURO: Forzamos el fondo claro */
        html, body {
            margin: 0;
            overflow-x: hidden;
            background-color: #fdf2f8 !important; 
            min-height: 100vh;
        }

        /* Fondo de gradiente animado protegido */
        .capa-fondo {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #fdf2f8, #e0f2fe, #f3e8ff, #ecfdf5) !important;
            background-size: 400% 400% !important;
            animation: gradientBG 15s ease infinite !important;
            z-index: -2;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor de las flores y animales flotantes */
        #contenedor-emojis {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .flotante {
            position: absolute;
            opacity: 0.4;
            will-change: transform;
            animation: flotar linear infinite;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
        }

        @keyframes flotar {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* Efectos visuales */
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            color: #374151 !important; /* Forzar texto oscuro en tarjetas */
        }

        textarea { resize: vertical; min-height: 120px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 20px; }
        .hidden-modal { display: none !important; }
    </style>
</head>

<body class="selection:bg-pink-200 selection:text-pink-900">

    <!-- Fondos -->
    <div class="capa-fondo"></div>
    <div id="contenedor-emojis"></div>

    <main class="max-w-4xl mx-auto p-4 md:p-6 lg:p-8 relative z-10">

        <!-- Cabecera -->
        <header class="glass-card rounded-[35px] p-8 mt-4 fade-in">
            <div class="text-center">
                <div class="text-7xl mb-4 animate-bounce hover:animate-none" style="animation-duration: 3s;">🌷</div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-sky-500 mb-2">
                    El Espacio de Jessica
                </h1>
                <p class="text-gray-500 text-lg md:text-xl font-medium">
                    Tu rincón emocional seguro y especial 🌸
                </p>
            </div>

            <div class="grid md:grid-cols-2 gap-4 mt-8">
                <div class="bg-pink-50/90 border border-pink-200 rounded-3xl p-5 shadow-sm">
                    <h2 class="font-bold text-pink-500 flex items-center gap-2 text-lg">
                        <span>📅</span> Fecha y hora
                    </h2>
                    <p id="fechaActual" class="mt-2 text-gray-700 font-medium"></p>
                </div>
                <div class="bg-sky-50/90 border border-sky-200 rounded-3xl p-5 shadow-sm">
                    <h2 class="font-bold text-sky-500 flex items-center gap-2 text-lg">
                        <span>☁️</span> Clima actual
                    </h2>
                    <div id="clima" class="mt-2">Cargando clima...</div>
                </div>
            </div>

            <!-- Formulario -->
            <div class="mt-8 bg-white/70 rounded-3xl p-6 border border-white">
                <label class="block font-bold text-gray-700 text-lg mb-3">
                    🌸 ¿Cómo te sientes hoy, Jessica?
                </label>
                
                <select id="emocion" class="w-full p-4 rounded-2xl border-2 border-pink-100 bg-white focus:border-pink-400 outline-none text-lg text-gray-700">
                    <option>😊 Feliz</option>
                    <option>🥰 Amada</option>
                    <option>😌 En paz</option>
                    <option>😢 Triste</option>
                    <option>😭 Muy triste</option>
                    <option>😔 Vacía</option>
                    <option>😰 Ansiosa</option>
                    <option>😡 Enojada</option>
                    <option>😩 Frustrada</option>
                    <option>🥺 Sensible</option>
                    <option>😴 Cansada</option>
                    <option>🌊 Perdida</option>
                    <option>🤍 Neutral</option>
                    <option>🙏 Agradecida</option>
                    <option>💔 Vulnerable</option>
                    <option>🤩 Emocionada</option>
                    <option>🌸 Esperanzada</option>
                    <option>🧠 Reflexiva</option>
                    <option>🌙 Nostálgica</option>
                </select>

                <textarea id="texto" class="w-full mt-4 p-4 rounded-2xl border-2 border-pink-100 bg-white focus:border-pink-400 outline-none text-gray-700 text-lg" placeholder="Escribe cómo te sientes hoy... (opcional 💕)"></textarea>

                <button id="btnGuardar" class="w-full mt-5 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white p-4 rounded-2xl text-lg font-bold shadow-lg transition-all">
                    Guardar entrada 🌸
                </button>

                <div class="grid grid-cols-2 gap-4 mt-5">
                    <button id="btnWord" class="flex justify-center gap-2 bg-white border-2 border-blue-100 hover:bg-blue-50 text-blue-600 p-3 rounded-2xl font-bold transition-all">
                        📄 Exportar Word
                    </button>
                    <button id="btnPDF" class="flex justify-center gap-2 bg-white border-2 border-red-100 hover:bg-red-50 text-red-600 p-3 rounded-2xl font-bold transition-all">
                        📕 Exportar PDF
                    </button>
                </div>
            </div>
        </header>

        <!-- Recuerdos -->
        <section class="mt-10 fade-in">
            <div class="flex items-center gap-3 mb-6 px-2">
                <h2 class="text-3xl font-extrabold text-gray-700">📖 Recuerdos Guardados</h2>
                <div class="h-1 flex-grow bg-gradient-to-r from-pink-200 to-transparent rounded-full opacity-50"></div>
            </div>
            
            <div id="lista" class="space-y-6">
                <div class="text-center p-10 text-gray-500 font-medium">Buscando tus recuerdos... ✨</div>
            </div>
        </section>
    </main>

    <!-- Modal Personalizado -->
    <div id="customModal" class="fixed inset-0 z-50 hidden-modal items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[30px] p-6 md:p-8 max-w-md w-full shadow-2xl border border-pink-100">
            <h3 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-2">Título</h3>
            <div id="modalBody" class="mb-6 text-gray-600"></div>
            <div class="flex justify-end gap-3">
                <button id="modalBtnCancel" class="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200">Cancelar</button>
                <button id="modalBtnConfirm" class="px-5 py-2.5 rounded-xl font-bold text-white bg-pink-500 hover:bg-pink-600">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSoz_PY7s67kMI8mULucVBX2bcVwwMTRg",
            authDomain: "el-espacio-de-jessica.firebaseapp.com",
            projectId: "el-espacio-de-jessica",
            storageBucket: "el-espacio-de-jessica.firebasestorage.app",
            messagingSenderId: "1061987617949",
            appId: "1:1061987617949:web:28b05e0016d31308f21874",
            measurementId: "G-MK8B3BNWSS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Refs
        const ui = {
            fechaActual: document.getElementById("fechaActual"),
            clima: document.getElementById("clima"),
            emocion: document.getElementById("emocion"),
            texto: document.getElementById("texto"),
            lista: document.getElementById("lista"),
            btnGuardar: document.getElementById("btnGuardar"),
            btnWord: document.getElementById("btnWord"),
            btnPDF: document.getElementById("btnPDF"),
            contenedorEmojis: document.getElementById("contenedor-emojis")
        };

        let entradasGuardadas = [];

        // Generar Flores y Animalitos
        function generarFondo() {
            // Emojis de flores, destellos y animalitos lindos
            const emojis = ["🌸", "✨", "🦋", "💖", "🌷", "🤍", "⭐", "🍓", "☁️", "🐰", "🐱", "🐶", "🐼", "🦊", "🐻"];
            const fragment = document.createDocumentFragment();
            
            // Aumenté a 50 para que se vea más vivo
            for (let i = 0; i < 50; i++) {
                const span = document.createElement("span");
                span.className = "flotante";
                span.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = `${Math.random() * 100}vw`;
                span.style.animationDuration = `${12 + Math.random() * 25}s`;
                span.style.fontSize = `${18 + Math.random() * 26}px`;
                span.style.animationDelay = `-${Math.random() * 20}s`;
                fragment.appendChild(span);
            }
            ui.contenedorEmojis.appendChild(fragment);
        }
        generarFondo();

        // Fecha
        function actualizarFecha() {
            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString("es-ES", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
            const horaStr = ahora.toLocaleTimeString("es-ES", { hour: '2-digit', minute: '2-digit' });
            ui.fechaActual.innerHTML = `<span class="text-gray-700">${fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1)}</span> <br> <span class="text-pink-500 font-bold text-xl">${horaStr}</span>`;
        }
        setInterval(actualizarFecha, 1000);
        actualizarFecha();

        // Clima
        async function cargarClima() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const respuesta = await fetch("https://wttr.in/?format=%c+%t+-+%C", { signal: controller.signal });
                clearTimeout(timeoutId);
                if(!respuesta.ok) throw new Error("Error");
                const texto = await respuesta.text();
                ui.clima.innerHTML = `<span class="inline-block bg-white px-3 py-1 rounded-full text-sky-700 font-bold border border-sky-100 shadow-sm">${texto.trim()}</span>`;
            } catch (error) {
                ui.clima.innerHTML = `<span class="text-gray-500 font-bold">No disponible 🌥️</span>`;
            }
        }
        cargarClima();

        // Modal
        let modalCallback = null;
        function showModal({ title, content, isPrompt, defaultValue }) {
            document.getElementById("modalTitle").innerText = title;
            const modalBody = document.getElementById("modalBody");
            if (isPrompt) {
                modalBody.innerHTML = `<textarea id="modalInputText" class="w-full mt-2 p-4 rounded-xl border-2 border-pink-100 focus:border-pink-400 outline-none h-40">${defaultValue || ''}</textarea>`;
            } else {
                modalBody.innerHTML = `<p class="text-lg">${content}</p>`;
            }
            document.getElementById("customModal").classList.remove("hidden-modal");
            document.getElementById("customModal").classList.add("flex");
            return new Promise(resolve => { modalCallback = resolve; });
        }

        function closeModal() {
            document.getElementById("customModal").classList.add("hidden-modal");
            document.getElementById("customModal").classList.remove("flex");
        }

        document.getElementById("modalBtnCancel").onclick = () => { if(modalCallback) modalCallback(null); closeModal(); };
        document.getElementById("modalBtnConfirm").onclick = () => { 
            const input = document.getElementById("modalInputText");
            if(modalCallback) modalCallback(input ? input.value : true); 
            closeModal(); 
        };

        // Firebase Guardar
        ui.btnGuardar.onclick = async () => {
            const btn = ui.btnGuardar;
            const originalText = btn.innerHTML;
            btn.innerHTML = "Guardando... ✨"; btn.disabled = true;

            try {
                await addDoc(collection(db, "entradas"), {
                    emocion: ui.emocion.value,
                    texto: ui.texto.value.trim(),
                    fecha: new Date().toLocaleString("es-ES", { dateStyle: 'medium', timeStyle: 'short' }),
                    timestamp: Date.now()
                });
                ui.texto.value = "";
                btn.innerHTML = "¡Guardado! 💖";
            } catch (error) {
                showModal({ title: "Error", content: "No pudimos guardar. Revisa las reglas de Firebase." });
            }
            setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 2000);
        };

        // Firebase Leer
        const q = query(collection(db, "entradas"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            ui.lista.innerHTML = "";
            entradasGuardadas = [];
            
            if (snapshot.empty) {
                ui.lista.innerHTML = `<div class="text-center p-10 bg-white/60 rounded-3xl border border-pink-200 shadow-sm"><span class="text-4xl block mb-3">🌱</span><p class="text-gray-600 font-bold">Aún no hay recuerdos guardados.</p></div>`;
                return;
            }

            snapshot.forEach((docu) => {
                const data = docu.data();
                entradasGuardadas.push({ id: docu.id, ...data });
                const card = document.createElement("article");
                card.className = "glass-card rounded-[30px] p-6 fade-in border-l-4 border-l-pink-400";
                
                const textoSeguro = data.texto ? data.texto.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "💭 Jessica solamente quiso guardar esta emoción.";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 flex-wrap sm:flex-nowrap">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${data.emocion}</h2>
                            <p class="text-gray-500 text-sm mt-1 font-bold">🕒 ${data.fecha || 'Fecha desconocida'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button data-action="edit" data-id="${docu.id}" class="bg-amber-100 hover:bg-amber-200 text-amber-700 px-4 py-2 rounded-xl font-bold text-sm transition-colors">Editar ✏️</button>
                            <button data-action="delete" data-id="${docu.id}" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-xl font-bold text-sm transition-colors">Borrar 🗑️</button>
                        </div>
                    </div>
                    <div class="mt-5 bg-white rounded-2xl p-5 text-gray-700 whitespace-pre-wrap leading-relaxed shadow-sm font-medium border border-gray-100">
                        ${textoSeguro}
                    </div>
                `;
                ui.lista.appendChild(card);
            });
        }, (error) => {
            // MENSAJE DE ERROR DE BASE DE DATOS
            ui.lista.innerHTML = `
                <div class="bg-red-50 border-2 border-red-200 rounded-3xl p-6 text-center shadow-lg">
                    <span class="text-5xl block mb-3">🔒</span>
                    <h3 class="text-xl font-bold text-red-600 mb-2">Base de datos bloqueada</h3>
                    <p class="text-red-500 font-medium mb-4">Firebase está bloqueando el acceso por seguridad.</p>
                    <div class="bg-white p-4 rounded-xl inline-block text-left text-sm text-gray-600 border border-red-100">
                        Ve a tu <b>Consola de Firebase > Firestore Database > Rules</b> y cambia las reglas a:<br><br>
                        <code class="bg-gray-100 p-2 rounded block text-red-500 font-mono">allow read, write: if true;</code>
                    </div>
                </div>
            `;
        });

        // Editar / Borrar
        ui.lista.addEventListener("click", async (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const entrada = entradasGuardadas.find(ent => ent.id === id);

            if (action === "delete") {
                const confirmar = await showModal({ title: "Eliminar recuerdo", content: "¿Borrar este recuerdo? Esta acción no se puede deshacer." });
                if (confirmar) await deleteDoc(doc(db, "entradas", id));
            } else if (action === "edit") {
                const nuevoTexto = await showModal({ title: "Editar recuerdo", isPrompt: true, defaultValue: entrada.texto });
                if (nuevoTexto !== null) await updateDoc(doc(db, "entradas", id), { texto: nuevoTexto });
            }
        });

        // Exportar Word
        ui.btnWord.onclick = () => {
            if (!entradasGuardadas.length) return showModal({ title: "Aviso", content: "No hay entradas para exportar." });
            let contenido = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:'Arial';color:#333}h1{color:#ec4899;text-align:center}.entrada{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #fce7f3}h2{color:#db2777;font-size:14pt}.fecha{color:#9ca3af;font-size:10pt}.texto{background-color:#fdf2f8;padding:15px;border-radius:10px}</style></head><body><h1>El Espacio de Jessica 🌸</h1>`;
            entradasGuardadas.forEach(ent => {
                contenido += `<div class="entrada"><h2>${ent.emocion}</h2><p class="fecha">🕒 ${ent.fecha}</p><div class="texto">${ent.texto ? ent.texto.replace(/\n/g, '<br>') : ''}</div></div>`;
            });
            const blob = new Blob(['\ufeff', contenido += `</body></html>`], { type: 'application/msword' });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Diario_Jessica.doc"; a.click();
        };

        // Exportar PDF
        ui.btnPDF.onclick = () => {
            if (!entradasGuardadas.length) return showModal({ title: "Aviso", content: "No hay entradas para exportar." });
            const docPDF = new window.jspdf.jsPDF();
            let y = 20; docPDF.setFontSize(22); docPDF.setTextColor(236, 72, 153); docPDF.text("El Espacio de Jessica", 105, y, { align: "center" }); y += 15;
            docPDF.setFontSize(11);
            entradasGuardadas.forEach(ent => {
                docPDF.setTextColor(219, 39, 119); docPDF.setFont("helvetica", "bold"); docPDF.text(ent.emocion, 20, y); y += 6;
                docPDF.setTextColor(156, 163, 175); docPDF.setFont("helvetica", "normal"); docPDF.text(`Fecha: ${ent.fecha}`, 20, y); y += 8;
                docPDF.setTextColor(55, 65, 81);
                const splitText = docPDF.splitTextToSize(ent.texto || "Solo emoción.", 170);
                if (y + (splitText.length * 6) > 280) { docPDF.addPage(); y = 20; }
                docPDF.text(splitText, 20, y); y += (splitText.length * 6) + 15;
                if (y > 280) { docPDF.addPage(); y = 20; }
            });
            docPDF.save("Diario_Jessica.pdf");
        };
    </script>
</body>
</html>
