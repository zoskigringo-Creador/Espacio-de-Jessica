<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="darkreader-lock">
    <title>El Espacio de Jessica 🌸</title>

    <!-- Google Fonts para una tipografía más suave y amigable -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF para la exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#f9a8d4',
                            blue: '#bae6fd'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #fdf2f8, #e0f2fe, #f3e8ff, #ecfdf5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Fondo de emojis flotantes optimizado */
        .fondo {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .flotante {
            position: absolute;
            opacity: 0.3;
            will-change: transform;
            animation: flotar linear infinite;
        }

        @keyframes flotar {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* Animaciones de entrada suaves */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efecto Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Personalización del Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #f9a8d4; }
        
        /* Ocultar elementos */
        .hidden-modal { display: none !important; }
    </style>
</head>

<body class="text-gray-800 selection:bg-pink-200 selection:text-pink-900">

    <!-- Fondo Animado -->
    <div class="fondo" id="fondo"></div>

    <main class="max-w-4xl mx-auto p-4 md:p-6 lg:p-8">

        <!-- Cabecera y Controles Principales -->
        <header class="glass-card rounded-[35px] p-8 mt-4 fade-in">
            <div class="text-center">
                <div class="text-7xl mb-4 animate-bounce hover:animate-none" style="animation-duration: 3s;">🌷</div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-sky-500 mb-2">
                    El Espacio de Jessica
                </h1>
                <p class="text-gray-500 text-lg md:text-xl font-medium">
                    Tu rincón emocional seguro y especial 🌸
                </p>
            </div>

            <!-- Tarjetas de Información -->
            <div class="grid md:grid-cols-2 gap-4 mt-8">
                <div class="bg-gradient-to-br from-pink-50 to-pink-100 border border-pink-200 rounded-3xl p-5 transition-transform hover:scale-[1.02] shadow-sm">
                    <h2 class="font-bold text-pink-600 flex items-center gap-2 text-lg">
                        <span>📅</span> Fecha y hora
                    </h2>
                    <p id="fechaActual" class="mt-2 text-gray-700 font-medium leading-relaxed"></p>
                </div>
                <div class="bg-gradient-to-br from-sky-50 to-sky-100 border border-sky-200 rounded-3xl p-5 transition-transform hover:scale-[1.02] shadow-sm">
                    <h2 class="font-bold text-sky-600 flex items-center gap-2 text-lg">
                        <span>☁️</span> Clima actual
                    </h2>
                    <div id="clima" class="mt-2 text-gray-700 font-medium leading-relaxed">
                        Cargando clima...
                    </div>
                </div>
            </div>

            <!-- Formulario de Entrada -->
            <div class="mt-8 bg-white/60 rounded-3xl p-6 border border-white/50">
                <label class="block font-bold text-gray-700 text-lg mb-3">
                    🌸 ¿Cómo te sientes hoy, Jessica?
                </label>
                
                <select id="emocion" class="w-full p-4 rounded-2xl border-2 border-pink-100 bg-white/90 focus:border-pink-400 focus:ring-0 outline-none text-lg transition-colors cursor-pointer shadow-sm">
                    <option>😊 Feliz</option>
                    <option>🥰 Amada</option>
                    <option>😌 En paz</option>
                    <option>😢 Triste</option>
                    <option>😭 Muy triste</option>
                    <option>😔 Vacía</option>
                    <option>😰 Ansiosa</option>
                    <option>😡 Enojada</option>
                    <option>😩 Frustrada</option>
                    <option>🥺 Sensible</option>
                    <option>😴 Cansada</option>
                    <option>😵 Abrumada</option>
                    <option>😞 Agotada</option>
                    <option>🌊 Perdida</option>
                    <option>🤍 Neutral</option>
                    <option>🙏 Agradecida</option>
                    <option>😬 Insegura</option>
                    <option>💔 Vulnerable</option>
                    <option>🤩 Emocionada</option>
                    <option>😶 Desconectada</option>
                    <option>🫤 Confundida</option>
                    <option>❤️ Lastimada</option>
                    <option>🌸 Esperanzada</option>
                    <option>🧠 Reflexiva</option>
                    <option>😇 Motivada</option>
                    <option>🌙 Nostálgica</option>
                    <option>😟 Preocupada</option>
                    <option>😮 Saturada</option>
                    <option>😎 Segura</option>
                    <option>🍂 Melancólica</option>
                </select>

                <textarea id="texto" class="w-full mt-4 p-4 rounded-2xl border-2 border-pink-100 bg-white/90 focus:border-pink-400 outline-none text-gray-700 shadow-sm transition-colors text-lg" placeholder="Escribe cómo te sientes hoy... (opcional 💕)"></textarea>

                <button id="btnGuardar" class="w-full mt-5 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white p-4 rounded-2xl text-lg font-bold shadow-lg shadow-pink-200 transition-all active:scale-[0.98]">
                    Guardar entrada 🌸
                </button>

                <!-- Botones de Exportación -->
                <div class="grid grid-cols-2 gap-4 mt-5">
                    <button id="btnWord" class="flex items-center justify-center gap-2 bg-white border-2 border-blue-100 hover:border-blue-400 hover:bg-blue-50 text-blue-600 p-3 rounded-2xl font-bold transition-all active:scale-95">
                        <span>📄</span> Exportar Word
                    </button>
                    <button id="btnPDF" class="flex items-center justify-center gap-2 bg-white border-2 border-red-100 hover:border-red-400 hover:bg-red-50 text-red-600 p-3 rounded-2xl font-bold transition-all active:scale-95">
                        <span>📕</span> Exportar PDF
                    </button>
                </div>
            </div>
        </header>

        <!-- Lista de Recuerdos -->
        <section class="mt-10 fade-in" style="animation-delay: 0.2s; animation-fill-mode: both;">
            <div class="flex items-center gap-3 mb-6 px-2">
                <h2 class="text-3xl font-extrabold text-gray-700">
                    📖 Recuerdos Guardados
                </h2>
                <div class="h-1 flex-grow bg-gradient-to-r from-pink-200 to-transparent rounded-full opacity-50"></div>
            </div>
            
            <div id="lista" class="space-y-6">
                <!-- Estado de carga por defecto -->
                <div class="text-center p-10 text-gray-400 font-medium">
                    <span class="animate-pulse inline-block text-2xl mb-2">✨</span><br>
                    Buscando tus recuerdos...
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Personalizado (Reemplaza alert/confirm/prompt) -->
    <div id="customModal" class="fixed inset-0 z-50 hidden-modal items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white rounded-[30px] p-6 md:p-8 max-w-md w-full shadow-2xl transform transition-transform scale-95 border border-pink-100">
            <h3 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-2">Título</h3>
            <div id="modalBody" class="mb-6 text-gray-600">
                <!-- Contenido dinámico -->
            </div>
            <div class="flex justify-end gap-3">
                <button id="modalBtnCancel" class="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition-colors">
                    Cancelar
                </button>
                <button id="modalBtnConfirm" class="px-5 py-2.5 rounded-xl font-bold text-white bg-pink-500 hover:bg-pink-600 shadow-md shadow-pink-200 transition-colors">
                    Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script type="module">
        // 1. Importaciones de Firebase (V10)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 2. Configuración de Firebase (Tu configuración original preservada para GitHub)
        const firebaseConfig = {
            apiKey: "AIzaSyDSoz_PY7s67kMI8mULucVBX2bcVwwMTRg",
            authDomain: "el-espacio-de-jessica.firebaseapp.com",
            projectId: "el-espacio-de-jessica",
            storageBucket: "el-espacio-de-jessica.firebasestorage.app",
            messagingSenderId: "1061987617949",
            appId: "1:1061987617949:web:28b05e0016d31308f21874",
            measurementId: "G-MK8B3BNWSS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. Referencias al DOM
        const ui = {
            fechaActual: document.getElementById("fechaActual"),
            clima: document.getElementById("clima"),
            emocion: document.getElementById("emocion"),
            texto: document.getElementById("texto"),
            lista: document.getElementById("lista"),
            fondo: document.getElementById("fondo"),
            btnGuardar: document.getElementById("btnGuardar"),
            btnWord: document.getElementById("btnWord"),
            btnPDF: document.getElementById("btnPDF"),
            // Modal
            modal: document.getElementById("customModal"),
            modalTitle: document.getElementById("modalTitle"),
            modalBody: document.getElementById("modalBody"),
            modalBtnCancel: document.getElementById("modalBtnCancel"),
            modalBtnConfirm: document.getElementById("modalBtnConfirm")
        };

        // Estado global para las entradas en memoria (útil para exportar sin volver a consultar el DOM)
        let entradasGuardadas = [];

        // 4. Utilidades UI (Fecha, Clima, Emojis Flotantes)
        function actualizarFecha() {
            const ahora = new Date();
            const opcionesFecha = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
            const fechaStr = ahora.toLocaleDateString("es-ES", opcionesFecha);
            const horaStr = ahora.toLocaleTimeString("es-ES", { hour: '2-digit', minute: '2-digit' });
            
            // Capitalizar primera letra
            const fechaCapitalizada = fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);
            
            ui.fechaActual.innerHTML = `${fechaCapitalizada} <br> <span class="text-pink-500 font-bold text-xl">${horaStr}</span>`;
        }
        setInterval(actualizarFecha, 1000);
        actualizarFecha();

        async function cargarClima() {
            try {
                // Se utiliza una petición timeout manual para evitar bloqueos largos
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const respuesta = await fetch("https://wttr.in/?format=%c+%t+-+%C", { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if(!respuesta.ok) throw new Error("Error en red");
                const texto = await respuesta.text();
                
                ui.clima.innerHTML = `
                    <div class="inline-flex items-center gap-2 bg-white/70 px-4 py-2 mt-1 rounded-2xl shadow-sm border border-white/50 backdrop-blur-sm">
                        <span class="text-lg font-bold text-sky-700">${texto.trim()}</span>
                    </div>
                `;
            } catch (error) {
                ui.clima.innerHTML = `
                    <div class="inline-flex items-center gap-2 bg-white/70 px-4 py-2 mt-1 rounded-2xl shadow-sm border border-white/50 backdrop-blur-sm">
                        <span class="text-gray-500 font-bold">No disponible 🌥️</span>
                    </div>
                `;
            }
        }
        cargarClima();

        function generarFondo() {
            const emojis = ["🌸", "✨", "🦋", "💖", "🌷", "🤍", "⭐", "🍓", "☁️", "💫"];
            const fragment = document.createDocumentFragment();
            
            for (let i = 0; i < 40; i++) {
                const span = document.createElement("span");
                span.className = "flotante";
                span.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                span.style.left = `${Math.random() * 100}vw`;
                span.style.animationDuration = `${12 + Math.random() * 25}s`;
                span.style.fontSize = `${16 + Math.random() * 24}px`;
                span.style.animationDelay = `-${Math.random() * 20}s`; // Para que inicien en distintos puntos
                fragment.appendChild(span);
            }
            ui.fondo.appendChild(fragment);
        }
        generarFondo();

        // 5. Sistema de Modal Personalizado
        let modalCallback = null;

        function showModal(opciones) {
            const { title, content, isPrompt, defaultValue, confirmText, confirmColor } = opciones;
            
            ui.modalTitle.innerText = title;
            ui.modalBtnConfirm.innerText = confirmText || "Aceptar";
            ui.modalBtnConfirm.className = `px-5 py-2.5 rounded-xl font-bold text-white shadow-md transition-colors ${confirmColor || 'bg-pink-500 hover:bg-pink-600 shadow-pink-200'}`;

            if (isPrompt) {
                ui.modalBody.innerHTML = `
                    <textarea id="modalInputText" class="w-full mt-2 p-4 rounded-xl border-2 border-pink-100 focus:border-pink-400 outline-none h-40 text-gray-700">${defaultValue || ''}</textarea>
                `;
            } else {
                ui.modalBody.innerHTML = `<p class="text-lg">${content}</p>`;
            }

            ui.modal.classList.remove("hidden-modal");
            ui.modal.classList.add("flex");
            // Efecto suave
            setTimeout(() => ui.modal.firstElementChild.classList.remove("scale-95"), 10);
            
            return new Promise((resolve) => {
                modalCallback = resolve;
            });
        }

        function closeModal() {
            ui.modal.firstElementChild.classList.add("scale-95");
            setTimeout(() => {
                ui.modal.classList.add("hidden-modal");
                ui.modal.classList.remove("flex");
                modalCallback = null;
            }, 150);
        }

        ui.modalBtnCancel.addEventListener("click", () => {
            if (modalCallback) modalCallback(null);
            closeModal();
        });

        ui.modalBtnConfirm.addEventListener("click", () => {
            if (modalCallback) {
                const input = document.getElementById("modalInputText");
                modalCallback(input ? input.value : true);
            }
            closeModal();
        });

        // 6. Lógica de Base de Datos (Firebase)
        
        // Guardar
        ui.btnGuardar.addEventListener("click", async () => {
            const emocion = ui.emocion.value;
            const texto = ui.texto.value.trim();
            const originalText = ui.btnGuardar.innerHTML;
            
            // Efecto de carga en el botón
            ui.btnGuardar.innerHTML = "Guardando... ✨";
            ui.btnGuardar.disabled = true;

            try {
                await addDoc(collection(db, "entradas"), {
                    emocion,
                    texto,
                    fecha: new Date().toLocaleString("es-ES", { dateStyle: 'medium', timeStyle: 'short' }),
                    timestamp: Date.now()
                });
                ui.texto.value = "";
                
                // Mostrar éxito brevemente
                ui.btnGuardar.innerHTML = "¡Guardado! 💖";
                ui.btnGuardar.classList.replace("from-pink-400", "from-green-400");
                ui.btnGuardar.classList.replace("to-pink-500", "to-green-500");
                
                setTimeout(() => {
                    ui.btnGuardar.innerHTML = originalText;
                    ui.btnGuardar.classList.replace("from-green-400", "from-pink-400");
                    ui.btnGuardar.classList.replace("to-green-500", "to-pink-500");
                    ui.btnGuardar.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error("Error al guardar:", error);
                let errorMessage = "No pudimos guardar tu entrada. Verifica tu conexión.";
                if (error.code === 'permission-denied') {
                    errorMessage = "Error de permisos. Debes actualizar las reglas de Firestore en la consola de Firebase para permitir escritura.";
                }
                showModal({ title: "Error al guardar", content: errorMessage, confirmColor: "bg-red-500" });
                ui.btnGuardar.innerHTML = originalText;
                ui.btnGuardar.disabled = false;
            }
        });

        // Leer (Tiempo Real)
        const q = query(collection(db, "entradas"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            ui.lista.innerHTML = "";
            entradasGuardadas = []; // Resetear arreglo local

            if (snapshot.empty) {
                ui.lista.innerHTML = `
                    <div class="text-center p-10 bg-white/50 rounded-3xl border border-dashed border-pink-200">
                        <span class="text-4xl block mb-3">🌱</span>
                        <p class="text-gray-500 font-medium text-lg">Aún no hay recuerdos guardados.<br>¡Escribe tu primera entrada arriba!</p>
                    </div>`;
                return;
            }

            snapshot.forEach((docu) => {
                const data = docu.data();
                entradasGuardadas.push({ id: docu.id, ...data });

                // Crear elemento DOM de forma segura (previniendo inyección HTML si hay caracteres especiales)
                const card = document.createElement("article");
                card.className = "glass-card rounded-[30px] p-6 fade-in border-l-4 border-l-pink-400";
                
                const textoSeguro = data.texto ? data.texto.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "💭 Jessica solamente quiso guardar esta emoción.";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 flex-wrap sm:flex-nowrap">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                ${data.emocion}
                            </h2>
                            <p class="text-gray-400 text-sm mt-1 font-medium flex items-center gap-1">
                                🕒 ${data.fecha || 'Fecha desconocida'}
                            </p>
                        </div>
                        <div class="flex gap-2 mt-2 sm:mt-0">
                            <button data-action="edit" data-id="${docu.id}" class="bg-amber-100 hover:bg-amber-200 text-amber-600 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                                Editar ✏️
                            </button>
                            <button data-action="delete" data-id="${docu.id}" class="bg-red-100 hover:bg-red-200 text-red-600 px-4 py-2 rounded-xl transition-colors font-bold text-sm">
                                Borrar 🗑️
                            </button>
                        </div>
                    </div>
                    <div class="mt-5 bg-white/60 rounded-2xl p-5 text-gray-700 whitespace-pre-wrap leading-relaxed shadow-inner font-medium">
                        ${textoSeguro}
                    </div>
                `;
                ui.lista.appendChild(card);
            });
        }, (error) => {
            console.error("Error leyendo datos:", error);
            
            if (error.code === 'permission-denied') {
                ui.lista.innerHTML = `
                    <div class="bg-red-50/80 rounded-[30px] p-6 border border-red-200 text-center">
                        <span class="text-4xl block mb-3">🔒</span>
                        <h3 class="text-xl font-bold text-red-600 mb-2">Base de datos bloqueada</h3>
                        <p class="text-red-500 font-medium text-sm md:text-base">
                            Firebase está bloqueando el acceso por seguridad.<br>
                            Ve a tu <b>Consola de Firebase &gt; Firestore Database &gt; Rules</b> y cambia las reglas a:<br>
                            <code class="block mt-2 bg-white/60 p-2 rounded-xl text-xs text-left">allow read, write: if true;</code>
                        </p>
                    </div>`;
            } else {
                ui.lista.innerHTML = `<div class="text-red-500 text-center p-5 font-bold">Hubo un problema de conexión al cargar los recuerdos.</div>`;
            }
        });

        // Event Delegation para Editar y Borrar
        ui.lista.addEventListener("click", async (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;

            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const entrada = entradasGuardadas.find(ent => ent.id === id);

            if (!entrada) return;

            if (action === "delete") {
                const confirmacion = await showModal({
                    title: "Eliminar recuerdo",
                    content: "¿Estás segura de que deseas borrar este recuerdo, Jessica? Esta acción no se puede deshacer.",
                    confirmText: "Sí, borrar",
                    confirmColor: "bg-red-500 hover:bg-red-600"
                });

                if (confirmacion) {
                    await deleteDoc(doc(db, "entradas", id));
                }
            } 
            else if (action === "edit") {
                const nuevoTexto = await showModal({
                    title: "Editar recuerdo",
                    isPrompt: true,
                    defaultValue: entrada.texto,
                    confirmText: "Guardar cambios",
                    confirmColor: "bg-pink-500 hover:bg-pink-600"
                });

                if (nuevoTexto !== null && nuevoTexto !== entrada.texto) {
                    await updateDoc(doc(db, "entradas", id), { texto: nuevoTexto });
                }
            }
        });

        // 7. Sistema de Exportación
        
        ui.btnWord.addEventListener("click", () => {
            if (entradasGuardadas.length === 0) {
                showModal({ title: "Aviso", content: "No hay entradas para exportar aún." });
                return;
            }

            let contenido = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <style>
                        body { font-family: 'Arial', sans-serif; color: #333; }
                        h1 { color: #ec4899; text-align: center; font-size: 24pt; }
                        .entrada { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #fce7f3; }
                        h2 { color: #db2777; font-size: 14pt; margin-bottom: 5px; }
                        .fecha { color: #9ca3af; font-size: 10pt; margin-top: 0; }
                        .texto { background-color: #fdf2f8; padding: 15px; border-radius: 10px; }
                    </style>
                </head>
                <body>
                    <h1>El Espacio de Jessica 🌸</h1>
            `;

            entradasGuardadas.forEach(ent => {
                const textoSafe = ent.texto ? ent.texto.replace(/\n/g, '<br>') : "💭 Sólo se guardó la emoción.";
                contenido += `
                    <div class="entrada">
                        <h2>${ent.emocion}</h2>
                        <p class="fecha">🕒 ${ent.fecha}</p>
                        <div class="texto">${textoSafe}</div>
                    </div>
                `;
            });
            contenido += `</body></html>`;

            const blob = new Blob(['\ufeff', contenido], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Diario_Jessica.doc";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        ui.btnPDF.addEventListener("click", () => {
            if (entradasGuardadas.length === 0) {
                showModal({ title: "Aviso", content: "No hay entradas para exportar aún." });
                return;
            }

            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF();
            
            // Configuración de página
            const pageWidth = docPDF.internal.pageSize.getWidth();
            const pageHeight = docPDF.internal.pageSize.getHeight();
            const margin = 20;
            const maxWidth = pageWidth - (margin * 2);
            let y = margin;

            // Título principal
            docPDF.setFontSize(22);
            docPDF.setTextColor(236, 72, 153); // Pink-500
            docPDF.text("El Espacio de Jessica", pageWidth/2, y, { align: "center" });
            y += 15;

            docPDF.setFontSize(11);
            
            entradasGuardadas.forEach(ent => {
                // Emoción
                docPDF.setTextColor(219, 39, 119); // Pink-600
                docPDF.setFont("helvetica", "bold");
                docPDF.text(ent.emocion, margin, y);
                y += 6;

                // Fecha
                docPDF.setTextColor(156, 163, 175); // Gray-400
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`Fecha: ${ent.fecha}`, margin, y);
                y += 8;

                // Texto
                docPDF.setTextColor(55, 65, 81); // Gray-700
                const texto = ent.texto || "Solo se guardó la emoción.";
                const splitText = docPDF.splitTextToSize(texto, maxWidth);
                
                // Verificar si necesitamos nueva página antes de imprimir el texto
                const textHeight = splitText.length * 6;
                if (y + textHeight > pageHeight - margin) {
                    docPDF.addPage();
                    y = margin;
                }
                
                docPDF.text(splitText, margin, y);
                y += textHeight + 15; // Espacio para la siguiente entrada

                // Si por los espacios extras excedemos, nueva página
                if (y > pageHeight - margin) {
                    docPDF.addPage();
                    y = margin;
                }
            });

            docPDF.save("Diario_Jessica.pdf");
        });

        // Prevenir cierre accidental si hay texto escrito
        window.addEventListener("beforeunload", (e) => {
            if (ui.texto.value.trim().length > 0) {
                e.preventDefault();
                e.returnValue = "";
            }
        });

    </script>
</body>
</html>
